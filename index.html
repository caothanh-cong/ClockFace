<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StandBy Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#b9c4ff;
  --white:#f5f5f7;
  --dim:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  position:fixed;inset:0;width:100%;height:100%;
  background:#000;color:var(--white);overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
}
body.night{--accent:#e5322d;--white:#e5322d;--dim:.55}

/* Stage: true centering inside safe areas */
#stage{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  opacity:var(--dim);transition:opacity .5s ease;
}
.view{display:none;align-items:center;justify-content:center}
.view.on{display:flex}

/* ---------- Classic: big time left, info column right ---------- */
#classic{gap:4vw}
.time{
  display:flex;align-items:center;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;
  font-size:min(66vh,30vw);height:.72em;line-height:.72;
  letter-spacing:-.01em;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.time .d{display:inline-block;text-align:center}
.colon{display:flex;flex-direction:column;gap:.17em;margin:0 .05em}
.colon i{display:block;width:.115em;height:.115em;border-radius:50%;background:var(--accent)}
.side{
  align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;
  height:min(47.5vh,21.6vw);min-width:20vw;
  font-size:min(8.5vh,4.2vw);font-weight:500;line-height:1.15;
}
.side b{font-weight:500;color:var(--accent);margin-right:.25em}
.side .sub{margin-top:.1em;opacity:.95}
.alarm{display:none;font-size:.95em}
.alarm.on{display:block}
.alarm svg{display:block;width:.9em;height:.9em;fill:var(--accent);margin-bottom:.2em}
.alarm small{font-size:.65em;font-weight:500}

/* ---------- Big: full-screen rounded numerals ---------- */
#big{width:100%;height:100%}
#bigTime{
  display:flex;align-items:center;justify-content:center;
  font-family:"Nunito","SF Pro Rounded",system-ui,sans-serif;font-weight:900;
  font-size:min(92vh,40vw);line-height:.8;letter-spacing:-.04em;
  color:var(--accent);
}
#bigTime span:nth-child(even){opacity:.62}
#bigTime .c{display:flex;flex-direction:column;gap:.22em;margin:0 -.02em;opacity:1!important}
#bigTime .c i{display:block;width:.15em;height:.15em;border-radius:50%;background:#e8e8ea}

/* ---------- Controls (fade out like the real thing) ---------- */
.hud{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:8px;align-items:center;z-index:5;
  padding:6px;border-radius:999px;background:rgba(40,40,44,.85);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:opacity .3s ease;
}
.hud.hide{opacity:0;pointer-events:none}
.hud button{
  width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
  color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.hud button:active{background:rgba(255,255,255,.3)}
.hud button.on{background:#fff;color:#000}
.sw{width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid #fff}
#alarmPanel{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;
  background:rgba(34,34,38,.96);border-radius:22px;padding:16px;display:none;
  flex-direction:column;gap:12px;align-items:center;min-width:220px;
}
#alarmPanel.open{display:flex}
#alarmPanel input{
  font:600 30px "Barlow Condensed",sans-serif;text-align:center;color:#fff;
  background:#111;border:0;border-radius:12px;padding:6px 10px;width:150px;
}
#alarmPanel .row{display:flex;gap:8px;width:100%}
#alarmPanel .row button{
  flex:1;padding:10px;border:0;border-radius:12px;font-size:15px;font-weight:600;
  background:#3a3a3e;color:#fff;
}
#alarmPanel .row button.go{background:#ff9f0a;color:#000}

/* ---------- Overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
}
.overlay.gone{display:none}
.overlay h2{font:600 26px -apple-system,sans-serif;color:#fff}
.overlay p{font-size:13px;color:#8e8e93;max-width:280px}
.overlay .row{display:flex;gap:12px}
.overlay button{
  border:0;border-radius:999px;padding:12px 26px;font-size:16px;font-weight:600;background:#fff;color:#000;
}
.overlay button.alt{background:#3a3a3e;color:#ff9f0a}
#ring h2{font-size:34px;color:#ff9f0a}

/* Portrait fallback: stack */
@media (orientation:portrait){
  #classic{flex-direction:column;gap:3vh}
  .time{font-size:34vw}
  .side{height:auto;min-width:0;width:80vw;flex-direction:row;align-items:flex-end;font-size:5vw}
  #bigTime{font-size:46vw;flex-direction:column}
}
</style>
</head>
<body>

<div id="stage">
  <!-- Classic -->
  <div id="classic" class="view on">
    <div class="time" id="time"></div>
    <div class="side">
      <div>
        <div><b id="dow">MON</b><span id="dom">5</span></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="alarm" id="alarmInfo">
        <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 100 16 8 8 0 000-16zm.9 8.4l-3.2 1.9-.7-1.2 2.6-1.5V7h1.3zM3.5 7.2l3.4-3-1-1.2-3.6 3.1zm17 0l-1.8-1.9-1 1.2 3.4 3z" fill-rule="evenodd"/></svg>
        <span id="alarmTxt"></span>
      </div>
    </div>
  </div>

  <!-- Big -->
  <div id="big" class="view">
    <div id="bigTime"></div>
  </div>
</div>

<div class="hud" id="hud">
  <button id="bStyle" title="Style">Aa</button>
  <button id="bColor" title="Color"><span class="sw"></span></button>
  <button id="bNight" title="Night mode">&#9790;</button>
  <button id="bAlarm" title="Alarm">&#9201;</button>
  <button id="bAwake" title="Keep awake">&#9728;</button>
</div>

<div id="alarmPanel">
  <input type="time" id="alarmInput" value="07:00">
  <div class="row">
    <button id="aClear">Clear</button>
    <button id="aSave" class="go">Save</button>
  </div>
</div>

<div class="overlay" id="start">
  <h2>StandBy</h2>
  <p>Tap to keep the screen awake and enable alarm sound. Swipe left or right to change style, tap the screen to show controls.</p>
  <button id="startBtn">Start</button>
</div>

<div class="overlay gone" id="ring">
  <h2>Alarm</h2>
  <div class="row">
    <button class="alt" id="snooze">Snooze</button>
    <button id="stop">Stop</button>
  </div>
</div>

<!-- Silent looping video: iOS keep-awake trick (replace src with your own valid tiny MP4 if the screen still sleeps) -->
<video id="nosleep" playsinline webkit-playsinline muted loop aria-hidden="true"
       style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none">
  <source src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAAAAGlzb20xaXNvMmF2YzEAAAAIZmcmZWUAAAA2bWRhdAEEAAYAAAAAH//gAAAAI21vb3YAAAAlbWhkZAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAABAAAAAA" type="video/mp4">
</video>

<script>
const COLORS = ['#b9c4ff','#6fba6f','#ffffff','#ffb340','#ff7ab6'];
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const $ = id => document.getElementById(id);

let S = { style:0, color:0, night:false, alarm:'', awake:false };
try { Object.assign(S, JSON.parse(localStorage.getItem('standby') || '{}')); } catch(e){}
S.awake = false;
const save = () => { try { localStorage.setItem('standby', JSON.stringify(S)); } catch(e){} };

/* ---------- Render ---------- */
function applyLook(){
  document.documentElement.style.setProperty('--accent', COLORS[S.color]);
  document.body.classList.toggle('night', S.night);
  $('bNight').classList.toggle('on', S.night);
  $('bAwake').classList.toggle('on', S.awake);
  $('classic').classList.toggle('on', S.style === 0);
  $('big').classList.toggle('on', S.style === 1);
  renderAlarm();
}

function fmt12(t){
  const [h,m] = t.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')}<small>${h>=12?'PM':'AM'}</small>`;
}
function renderAlarm(){
  $('alarmInfo').classList.toggle('on', !!S.alarm);
  if (S.alarm) $('alarmTxt').innerHTML = fmt12(S.alarm);
}

let lastKey = '';
function tick(){
  const n = new Date();
  const h = n.getHours()%12 || 12;
  const m = String(n.getMinutes()).padStart(2,'0');
  const key = h + ':' + m;
  if (key !== lastKey){
    lastKey = key;
    const hs = String(h).split('').map(c => `<span class="d">${c}</span>`).join('');
    const ms = m.split('').map(c => `<span class="d">${c}</span>`).join('');
    $('time').innerHTML = `${hs}<span class="colon"><i></i><i></i></span>${ms}`;
    $('bigTime').innerHTML = String(h).split('').map(c=>`<span>${c}</span>`).join('') +
      `<span class="c"><i></i><i></i></span>` + m.split('').map(c=>`<span>${c}</span>`).join('');
    $('dow').textContent = DAYS[n.getDay()];
    $('dom').textContent = n.getDate();
    checkAlarm(n);
  }
}
setInterval(tick, 1000);

/* ---------- Alarm ---------- */
let snoozeAt = '', firedKey = '', ringTimer = null;
function checkAlarm(n){
  const hhmm = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  if (firedKey === hhmm) return;
  if ((S.alarm && S.alarm === hhmm) || snoozeAt === hhmm){
    firedKey = hhmm; snoozeAt = '';
    ring();
  }
}
function beep(){
  try{
    const c = ctx(), t = c.currentTime;
    [880,1100,880,1100].forEach((f,i)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.25,t+i*.18);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.15);
      o.connect(g); g.connect(c.destination);
      o.start(t+i*.18); o.stop(t+i*.18+.16);
    });
  }catch(e){}
}
function ring(){
  $('ring').classList.remove('gone');
  beep(); ringTimer = setInterval(beep, 1500);
}
function endRing(){
  clearInterval(ringTimer); ringTimer = null;
  $('ring').classList.add('gone');
}
$('stop').onclick = endRing;
$('snooze').onclick = () => {
  endRing();
  const n = new Date(Date.now() + 9*60000);
  snoozeAt = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
};

let _ctx = null;
function ctx(){
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}

/* ---------- Keep awake ---------- */
const vid = $('nosleep');
let wl = null;
async function awakeOn(){
  S.awake = true;
  try { vid.currentTime = 0; await vid.play(); } catch(e){}
  if ('wakeLock' in navigator){ try { wl = await navigator.wakeLock.request('screen'); } catch(e){} }
  applyLook();
}
function awakeOff(){
  S.awake = false;
  vid.pause();
  if (wl){ wl.release().catch(()=>{}); wl = null; }
  applyLook();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.awake) awakeOn(); });
setInterval(() => { if (S.awake && vid.paused) vid.play().catch(()=>{}); }, 4000);

/* ---------- Controls ---------- */
let hudT = null;
function showHud(){
  $('hud').classList.remove('hide');
  clearTimeout(hudT);
  hudT = setTimeout(() => { $('hud').classList.add('hide'); }, 3500);
}
$('stage').addEventListener('click', () => {
  $('alarmPanel').classList.remove('open');
  if ($('hud').classList.contains('hide')) showHud();
  else { $('hud').classList.add('hide'); clearTimeout(hudT); }
});
$('hud').addEventListener('click', e => { e.stopPropagation(); showHud(); });

$('bStyle').onclick = () => { S.style = (S.style + 1) % 2; save(); applyLook(); };
$('bColor').onclick = () => { S.color = (S.color + 1) % COLORS.length; S.night = false; save(); applyLook(); };
$('bNight').onclick = () => { S.night = !S.night; save(); applyLook(); };
$('bAwake').onclick = () => S.awake ? awakeOff() : awakeOn();
$('bAlarm').onclick = () => {
  if (S.alarm) $('alarmInput').value = S.alarm;
  $('alarmPanel').classList.toggle('open');
};
$('aSave').onclick = () => {
  S.alarm = $('alarmInput').value || ''; save(); renderAlarm();
  $('alarmPanel').classList.remove('open');
};
$('aClear').onclick = () => {
  S.alarm = ''; save(); renderAlarm();
  $('alarmPanel').classList.remove('open');
};

/* Swipe to change style */
let sx = 0;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50 && !e.target.closest('#alarmPanel, .hud, .overlay')){
    S.style = (S.style + (dx < 0 ? 1 : 1)) % 2; save(); applyLook();
  }
}, {passive:true});

/* Start gate (needed for audio + video playback on iOS) */
$('startBtn').onclick = async () => {
  $('start').classList.add('gone');
  ctx();
  await awakeOn();
  showHud();
};

applyLook(); tick(); showHud();
</script>
</body>
</html>
